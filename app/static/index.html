<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KeyShield — API key masker</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#22c55e; --warn:#f59e0b; --err:#ef4444; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    p.sub { margin: 0 0 20px; color: var(--muted); }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
    label { display:block; font-weight:600; margin-bottom:6px; }
    textarea { width:100%; height:320px; padding:12px; border-radius:8px; border:1px solid #334155;
               background:var(--panel); color:var(--text); font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; resize:vertical; }
    textarea[readonly] { border-color:#14532d; }
    .bar { display:flex; gap:10px; align-items:center; margin-top:14px; flex-wrap:wrap; }
    button { padding:10px 18px; border:0; border-radius:8px; font-weight:600; cursor:pointer; }
    #maskBtn { background:var(--accent); color:#052e16; }
    .secondary { background:#334155; color:var(--text); }
    button:disabled { opacity:.6; cursor:wait; }
    #status { color:var(--muted); }
    #status.found { color:var(--warn); }
    #status.error { color:var(--err); }
  </style>
</head>
<body>
<main>
  <h1><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="vertical-align:-3px"><path fill="#22c55e" d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3z"/></svg> KeyShield</h1>
  <p class="sub">Paste text below. API keys starting with <code>sk-</code> or <code>tvly-</code> are masked as <code>****</code>. Nothing is stored.</p>

  <div class="grid">
    <div>
      <label for="input">Input</label>
      <textarea id="input" spellcheck="false" placeholder="e.g. OPENAI_API_KEY=sk-...  TAVILY_API_KEY=tvly-..."></textarea>
    </div>
    <div>
      <label for="output">Output (masked)</label>
      <textarea id="output" readonly spellcheck="false" placeholder="Masked text appears here"></textarea>
    </div>
  </div>

  <div class="bar">
    <button id="maskBtn" type="button">Mask secrets</button>
    <button id="sampleBtn" class="secondary" type="button">Load sample</button>
    <button id="copyBtn" class="secondary" type="button">Copy output</button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>
</main>

<script>
  const input = document.getElementById("input");
  const output = document.getElementById("output");
  const statusEl = document.getElementById("status");
  const maskBtn = document.getElementById("maskBtn");

  function setStatus(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className = cls || "";
  }

  // Sample keys are built at runtime from random characters so no
  // key-shaped literal ever lives in the source code.
  function fakeBody(n) {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    let s = "";
    for (let i = 0; i < n; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }

  document.getElementById("sampleBtn").addEventListener("click", () => {
    input.value =
      "# .env\n" +
      "OPENAI_API_KEY=" + "sk-" + "proj-" + fakeBody(32) + "\n" +
      "TAVILY_API_KEY=" + "tvly-" + fakeBody(32) + "\n\n" +
      "We use scikit-learn (sk-learn) for the risk-assessment model.\n";
    setStatus("Sample loaded (fake keys).");
  });

  maskBtn.addEventListener("click", async () => {
    maskBtn.disabled = true;
    setStatus("Scanning…");
    try {
      const res = await fetch("/api/mask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: input.value }),
      });
      if (!res.ok) {
        const detail = res.status === 422 ? "Input too large or invalid." : `Server error (${res.status}).`;
        throw new Error(detail);
      }
      const data = await res.json();
      output.value = data.masked_text; // .value never interprets HTML
      setStatus(
        data.count === 0 ? "No API keys found." : `Masked ${data.count} key${data.count === 1 ? "" : "s"}.`,
        data.count ? "found" : ""
      );
    } catch (err) {
      setStatus(err.message || "Network error.", "error");
    } finally {
      maskBtn.disabled = false;
    }
  });

  document.getElementById("copyBtn").addEventListener("click", async () => {
    if (!output.value) return setStatus("Nothing to copy.");
    try {
      await navigator.clipboard.writeText(output.value);
      setStatus("Output copied.");
    } catch {
      output.select();
      setStatus("Select-all done — press Ctrl/Cmd+C to copy.");
    }
  });
</script>
</body>
</html>
